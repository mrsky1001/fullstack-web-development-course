<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вебинар 6: Шаг 7 — Авторизация и localStorage</title>
    <link rel="stylesheet" href="../../basic/css/style.css">
    <link rel="icon" type="image/svg+xml" href="../../basic/img/logo.svg">
    <style>
        .lesson-panel {
            background: #1e293b; color: #f1f5f9; padding: 24px 32px; margin: 30px auto; max-width: 800px;
            border-top: 4px solid #06b6d4; border-radius: 8px; font-family: monospace;
        }
        .lesson-panel h2 { color: #22d3ee; margin-top: 0; }
        .form-demo-box {
            background: white; border-radius: 8px; padding: 24px; color: #1e293b; margin-top: 16px; font-family: sans-serif;
            max-width: 400px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .form-control { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; margin: 6px 0 12px; box-sizing: border-box; }
        .submit-btn { width: 100%; padding: 10px; background: #06b6d4; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .auth-status { background: #0f172a; border: 1px dashed #22d3ee; padding: 16px; border-radius: 6px; color: #22d3ee; margin-top: 16px; font-size: 15px; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <a href="../../basic/index.html" class="logo">
                <img src="../../basic/img/logo.svg" alt="logo" class="logo-icon">
                <span>СмартОфис</span>
            </a>
            <span style="color:#666;">Шаг 7: Финал 6-го вебинара (localStorage)</span>
        </div>
    </header>

    <main class="container" style="margin-top: 30px;">
        <div class="lesson-panel">
            <h2>🔐 Шаг 7: Вход в систему и сохранение в localStorage</h2>
            <p style="font-family: sans-serif; color: #94a3b8;">
                Тестовые данные для входа: логин: <code>admin</code>, пароль: <code>12345</code>.
            </p>

            <div class="form-demo-box">
                <form id="loginForm">
                    <label>Логин:</label>
                    <input type="text" id="login" class="form-control" placeholder="admin">

                    <label>Пароль:</label>
                    <input type="password" id="password" class="form-control" placeholder="12345">

                    <button type="submit" class="submit-btn">Войти в СмартОфис</button>
                </form>
            </div>

            <div class="auth-status" id="authBox">
                Статус авторизации: <strong id="userLabel">Гость (не авторизован)</strong>
                <div style="margin-top: 8px;">
                    <button onclick="logout()" style="background:#ef4444; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;">Выйти (localStorage.removeItem)</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const form = document.getElementById('loginForm');
        const userLabel = document.getElementById('userLabel');

        function updateUI() {
            const user = localStorage.getItem('currentUser');
            if (user) {
                userLabel.textContent = 'Авторизован как "' + user + '"! 🎉';
                userLabel.style.color = '#4ade80';
            } else {
                userLabel.textContent = 'Гость (не авторизован)';
                userLabel.style.color = '#94a3b8';
            }
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const log = document.getElementById('login').value.trim();
            const pass = document.getElementById('password').value.trim();

            if (log === 'admin' && pass === '12345') {
                localStorage.setItem('currentUser', log);
                alert('Успешный вход в систему!');
                updateUI();
            } else {
                alert('Неверный логин или пароль! Используйте admin / 12345');
            }
        });

        function logout() {
            localStorage.removeItem('currentUser');
            alert('Вы вышли из системы!');
            updateUI();
        }

        updateUI();
    </script>
</body>
</html>
