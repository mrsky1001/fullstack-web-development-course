<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вебинар 6: Шаг 3 — Свойство .value</title>
    <link rel="stylesheet" href="../../basic/css/style.css">
    <link rel="icon" type="image/svg+xml" href="../../basic/img/logo.svg">
    <style>
        .lesson-panel {
            background: #1e293b; color: #f1f5f9; padding: 24px 32px; margin: 30px auto; max-width: 800px;
            border-top: 4px solid #8b5cf6; border-radius: 8px; font-family: monospace;
        }
        .lesson-panel h2 { color: #a78bfa; margin-top: 0; }
        .form-demo-box {
            background: white; border-radius: 8px; padding: 24px; color: #1e293b; margin-top: 16px; font-family: sans-serif;
            max-width: 400px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .form-input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; margin: 8px 0 16px; box-sizing: border-box; }
        .submit-btn { width: 100%; padding: 10px; background: #8b5cf6; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .result-box { background: #0f172a; border: 1px dashed #a78bfa; padding: 12px; border-radius: 6px; color: #a78bfa; margin-top: 12px; font-size: 14px; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <a href="../../basic/index.html" class="logo">
                <img src="../../basic/img/logo.svg" alt="logo" class="logo-icon">
                <span>СмартОфис</span>
            </a>
            <span style="color:#666;">Шаг 3: Свойство .value у полей ввода</span>
        </div>
    </header>

    <main class="container" style="margin-top: 30px;">
        <div class="lesson-panel">
            <h2>⌨️ Шаг 3: Читаем ввод пользователя через input.value</h2>
            <p style="font-family: sans-serif; color: #94a3b8;">
                Введите любой текст в поле и нажмите кнопку. JS прочитает свойство <code>.value</code>:
            </p>

            <div class="form-demo-box">
                <label>Имя пользователя:</label>
                <input type="text" id="nameField" class="form-input" placeholder="Например: Иван Иванов">
                <button type="button" class="submit-btn" onclick="readValue()">Прочитать .value</button>
            </div>

            <div class="result-box" id="resultBox">Введите текст выше и нажмите кнопку...</div>
        </div>
    </main>

    <script>
        function readValue() {
            const input = document.getElementById('nameField');
            const val = input.value;
            const box = document.getElementById('resultBox');
            box.textContent = 'input.value -> "' + val + '" (длина строки: ' + val.length + ' символов)';
            console.log('Прочитано значение:', val);
        }
    </script>
</body>
</html>
