<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вебинар 7: Шаг 4 — clearInterval</title>
    <link rel="stylesheet" href="../../basic/css/style.css">
    <link rel="icon" type="image/svg+xml" href="../../basic/img/logo.svg">
    <style>
        .lesson-panel {
            background: #1e293b; color: #f1f5f9; padding: 24px 32px; margin: 30px auto; max-width: 800px;
            border-top: 4px solid #ef4444; border-radius: 8px; font-family: monospace;
        }
        .lesson-panel h2 { color: #f87171; margin-top: 0; }
        .code-block { background: #0f172a; color: #a3e635; padding: 14px; border-radius: 6px; line-height: 1.6; white-space: pre-wrap; margin: 12px 0; }
        .timer-box { font-size: 28px; font-weight: bold; color: #38bdf8; margin: 16px 0; font-family: sans-serif; }
        .click-btn { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <a href="../../basic/index.html" class="logo">
                <img src="../../basic/img/logo.svg" alt="logo" class="logo-icon">
                <span>СмартОфис</span>
            </a>
            <span style="color:#666;">Шаг 4: Сброс таймера (clearInterval)</span>
        </div>
    </header>

    <main class="container" style="margin-top: 30px;">
        <div class="lesson-panel">
            <h2>🔄 Шаг 4: Перезапуск таймера при клике</h2>
            <p style="font-family: sans-serif; color: #94a3b8;">
                Таймер считает до 3 секунд. Если нажать кнопку «Кликнуть вручную», таймер моментально сбрасывается в 0, чтобы пользователю было комфортно смотреть слайд!
            </p>

            <div class="timer-box" id="timeDisplay">Прошло: 0.0 сек</div>

            <button class="click-btn" onclick="userClick()">🖱️ Кликнуть вручную (сбросить таймер)</button>
        </div>
    </main>

    <script>
        let ms = 0;
        let timer = null;

        function run() {
            if (timer) clearInterval(timer);
            ms = 0;
            timer = setInterval(() => {
                ms += 100;
                document.getElementById('timeDisplay').textContent = 'Прошло: ' + (ms / 1000).toFixed(1) + ' сек';
                if (ms >= 3000) {
                    ms = 0;
                    console.log('3 секунды прошли -> автопереключение слайда!');
                }
            }, 100);
        }

        function userClick() {
            console.log('Пользователь кликнул -> сброс таймера!');
            run();
        }

        run();
    </script>
</body>
</html>
