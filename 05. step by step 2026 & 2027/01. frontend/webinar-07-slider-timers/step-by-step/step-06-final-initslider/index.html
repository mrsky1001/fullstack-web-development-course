<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вебинар 7: Шаг 6 — Финал слайдера</title>
    <link rel="stylesheet" href="../../basic/css/style.css">
    <link rel="icon" type="image/svg+xml" href="../../basic/img/logo.svg">
    <style>
        .lesson-panel {
            background: #1e293b; color: #f1f5f9; padding: 24px 32px; margin: 30px auto; max-width: 900px;
            border-top: 4px solid #10b981; border-radius: 8px; font-family: monospace;
        }
        .lesson-panel h2 { color: #34d399; margin-top: 0; }
        .badge { background: #059669; color: white; padding: 4px 10px; border-radius: 20px; font-size: 13px; font-family: sans-serif; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <a href="../../basic/index.html" class="logo">
                <img src="../../basic/img/logo.svg" alt="logo" class="logo-icon">
                <span>СмартОфис</span>
            </a>
            <span class="badge">Вебинар 7: Финал initSlider()</span>
        </div>
    </header>

    <main class="container" style="margin-top: 20px;">
        <!-- Тот самый блок слайдера из СмартОфиса -->
        <section class="slider-section">
            <div class="slider">
                <div class="slide active"><img src="../../basic/img/slider-1.jpg" alt="Слайд 1" class="slide-img"></div>
                <div class="slide"><img src="../../basic/img/slider-2.jpg" alt="Слайд 2" class="slide-img"></div>
                <div class="slide"><img src="../../basic/img/slider-3.jpg" alt="Слайд 3" class="slide-img"></div>
                <div class="slide"><img src="../../basic/img/slider-4.jpg" alt="Слайд 4" class="slide-img"></div>
                <button class="slider-btn slider-prev">‹</button>
                <button class="slider-btn slider-next">›</button>
                <div class="slider-dots">
                    <span class="dot active"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
            </div>
        </section>

        <div class="lesson-panel">
            <h2>🏆 Финал 7-го вебинара: Модульный слайдер работает!</h2>
            <p style="font-family: sans-serif; color: #94a3b8;">
                Этот слайдер теперь полностью автономен: работает автосмена 3 сек, стрелки, точки, сброс таймера и защита от ошибок.
            </p>
        </div>
    </main>

    <script>
        function initSlider() {
            const slides = document.querySelectorAll('.slide');
            const dots = document.querySelectorAll('.dot');
            const prevBtn = document.querySelector('.slider-prev');
            const nextBtn = document.querySelector('.slider-next');
            if (!slides.length) return;

            let currentSlide = 0;
            let timerId = null;

            function showSlide(index) {
                if (index >= slides.length) currentSlide = 0;
                else if (index < 0) currentSlide = slides.length - 1;
                else currentSlide = index;

                slides.forEach((s, i) => s.classList.toggle('active', i === currentSlide));
                dots.forEach((d, i) => d.classList.toggle('active', i === currentSlide));
            }

            function next() { showSlide(currentSlide + 1); }
            function prev() { showSlide(currentSlide - 1); }

            function startAuto() {
                stopAuto();
                timerId = setInterval(next, 3000);
            }

            function stopAuto() {
                if (timerId) clearInterval(timerId);
            }

            if (nextBtn) nextBtn.addEventListener('click', () => { next(); startAuto(); });
            if (prevBtn) prevBtn.addEventListener('click', () => { prev(); startAuto(); });

            dots.forEach((dot, idx) => {
                dot.addEventListener('click', () => {
                    showSlide(idx);
                    startAuto();
                });
            });

            startAuto();
        }

        document.addEventListener('DOMContentLoaded', initSlider);
    </script>
</body>
</html>
