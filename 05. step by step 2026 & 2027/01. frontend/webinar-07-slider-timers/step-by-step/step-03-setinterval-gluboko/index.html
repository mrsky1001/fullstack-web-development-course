<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вебинар 7: Шаг 3 — Таймер setInterval</title>
    <link rel="stylesheet" href="../../basic/css/style.css">
    <link rel="icon" type="image/svg+xml" href="../../basic/img/logo.svg">
    <style>
        .lesson-panel {
            background: #1e293b; color: #f1f5f9; padding: 24px 32px; margin: 30px auto; max-width: 800px;
            border-top: 4px solid #f59e0b; border-radius: 8px; font-family: monospace;
        }
        .lesson-panel h2 { color: #fbbf24; margin-top: 0; }
        .code-block { background: #0f172a; color: #a3e635; padding: 14px; border-radius: 6px; line-height: 1.6; white-space: pre-wrap; margin: 12px 0; }
        .timer-display { font-size: 36px; font-weight: bold; color: #fbbf24; margin: 16px 0; font-family: sans-serif; }
        .demo-btn { background: #f59e0b; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; margin: 4px; font-weight: bold; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <a href="../../basic/index.html" class="logo">
                <img src="../../basic/img/logo.svg" alt="logo" class="logo-icon">
                <span>СмартОфис</span>
            </a>
            <span style="color:#666;">Шаг 3: Таймер setInterval</span>
        </div>
    </header>

    <main class="container" style="margin-top: 30px;">
        <div class="lesson-panel">
            <h2>⏱️ Шаг 3: Автопереключение через setInterval</h2>
            <p style="font-family: sans-serif; color: #94a3b8;">
                Каждые 1000 миллисекунд (1 секунду) таймер выполняет функцию и увеличивает счётчик:
            </p>

            <div class="code-block">let count = 0;
const timerId = setInterval(() => {
    count++;
}, 1000);</div>

            <div class="timer-display" id="timerBox">0 сек</div>

            <div>
                <button class="demo-btn" onclick="startTimer()">Запустить (start)</button>
                <button class="demo-btn" style="background:#ef4444;" onclick="stopTimer()">Остановить (stop)</button>
            </div>
        </div>
    </main>

    <script>
        let counter = 0;
        let id = null;

        function startTimer() {
            if (id) clearInterval(id); // Защита от дублей
            id = setInterval(() => {
                counter++;
                document.getElementById('timerBox').textContent = counter + ' сек';
            }, 1000);
        }

        function stopTimer() {
            clearInterval(id);
            id = null;
        }

        startTimer();
    </script>
</body>
</html>
