<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вебинар 7: Шаг 5 — toggle с условием</title>
    <link rel="stylesheet" href="../../basic/css/style.css">
    <link rel="icon" type="image/svg+xml" href="../../basic/img/logo.svg">
    <style>
        .lesson-panel {
            background: #1e293b; color: #f1f5f9; padding: 24px 32px; margin: 30px auto; max-width: 800px;
            border-top: 4px solid #8b5cf6; border-radius: 8px; font-family: monospace;
        }
        .lesson-panel h2 { color: #a78bfa; margin-top: 0; }
        .code-block { background: #0f172a; color: #a3e635; padding: 14px; border-radius: 6px; line-height: 1.6; white-space: pre-wrap; margin: 12px 0; }
        .demo-btn { background: #8b5cf6; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; margin: 4px; font-weight: bold; }
        .dot-demo { display: inline-block; width: 16px; height: 16px; border-radius: 50%; background: #475569; margin: 4px; transition: background 0.2s; }
        .dot-demo.active { background: #38bdf8; transform: scale(1.3); }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <a href="../../basic/index.html" class="logo">
                <img src="../../basic/img/logo.svg" alt="logo" class="logo-icon">
                <span>СмартОфис</span>
            </a>
            <span style="color:#666;">Шаг 5: classList.toggle с условием</span>
        </div>
    </header>

    <main class="container" style="margin-top: 30px;">
        <div class="lesson-panel">
            <h2>✨ Шаг 5: Изящное переключение классов одной строкой</h2>
            <p style="font-family: sans-serif; color: #94a3b8;">
                Вместо громоздких условий <code>if / else</code> мы пишем:
            </p>

            <div class="code-block">dots.forEach((dot, i) => dot.classList.toggle('active', i === currentSlide));</div>

            <p style="font-family: sans-serif; color: #e2e8f0; margin-top: 16px;">🎮 Выберите активный элемент (0, 1, 2):</p>
            <div>
                <button class="demo-btn" onclick="setActive(0)">Индекс 0</button>
                <button class="demo-btn" onclick="setActive(1)">Индекс 1</button>
                <button class="demo-btn" onclick="setActive(2)">Индекс 2</button>
            </div>

            <div style="margin-top: 20px;">
                <span class="dot-demo active"></span>
                <span class="dot-demo"></span>
                <span class="dot-demo"></span>
            </div>
        </div>
    </main>

    <script>
        const dots = document.querySelectorAll('.dot-demo');

        function setActive(currentIdx) {
            // Всего одна строчка обновляет все точки:
            dots.forEach((d, i) => d.classList.toggle('active', i === currentIdx));
            console.log('Активный индекс:', currentIdx);
        }
    </script>
</body>
</html>
