<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вебинар 8: Шаг 1 — Событие input</title>
    <link rel="stylesheet" href="../../basic/css/style.css">
    <link rel="icon" type="image/svg+xml" href="../../basic/img/logo.svg">
    <style>
        .lesson-panel {
            background: #1e293b; color: #f1f5f9; padding: 24px 32px; margin: 30px auto; max-width: 800px;
            border-top: 4px solid #3b82f6; border-radius: 8px; font-family: monospace;
        }
        .lesson-panel h2 { color: #60a5fa; margin-top: 0; }
        .search-field { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; margin: 12px 0; }
        .live-preview { background: #0f172a; border: 1px dashed #38bdf8; padding: 16px; border-radius: 6px; color: #38bdf8; font-size: 15px; margin-top: 10px; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <a href="../../basic/index.html" class="logo">
                <img src="../../basic/img/logo.svg" alt="logo" class="logo-icon">
                <span>СмартОфис</span>
            </a>
            <span style="color:#666;">Шаг 1: Живой ввод (событие input)</span>
        </div>
    </header>

    <main class="container" style="margin-top: 30px;">
        <div class="lesson-panel">
            <h2>🔍 Шаг 1: Мгновенная реакция на нажатие клавиш</h2>
            <p style="font-family: sans-serif; color: #94a3b8;">
                Печатайте в поле ниже — каждый символ сразу отображается в блоке предварительного просмотра:
            </p>

            <input type="text" id="liveSearch" class="search-field" placeholder="Начните вводить название комнаты...">

            <div class="live-preview" id="previewBox">Здесь будет отображаться живой ввод...</div>
        </div>
    </main>

    <script>
        const input = document.getElementById('liveSearch');
        const preview = document.getElementById('previewBox');

        input.addEventListener('input', () => {
            const query = input.value;
            preview.textContent = 'Поисковый запрос: "' + query + '" (символов: ' + query.length + ')';
            console.log('Событие input:', query);
        });
    </script>
</body>
</html>
