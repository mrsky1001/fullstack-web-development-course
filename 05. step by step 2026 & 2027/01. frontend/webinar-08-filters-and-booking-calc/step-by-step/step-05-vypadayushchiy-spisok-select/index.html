  <link rel="stylesheet" href="../../basic/css/style.css">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="../../basic/img/logo.svg">
  <script src="data.js" defer></script>
  <script src="main.js" defer></script>
</head>
<body>
  <header class="header">
    <div class="container header-container">
      <a href="../../basic/index.html" class="logo">
        <img src="../../basic/img/logo.svg" alt="logo" class="logo-icon">
        <span>СмартОфис</span>
      </a>
      <nav class="nav">
        <ul class="nav-list">
          <li><a href="../../basic/index.html" class="nav-link">Главная</a></li>
          <li><a href="#" class="nav-link active">Каталог</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="main">
    <div class="container">
      <section class="hero-section"><h1 class="hero-title">Фильтры и калькулятор <span class="brand-highlight">«СмартОфис»</span></h1><p class="hero-subtitle">Учебный шаг 5 из 6: живой поиск и вычисления</p></section><div class="toolbar-demo">
          <label style="color:#cbd5e1;">Сортировка:</label>
          <select id="demoSort">
            <option value="default">По умолчанию</option>
            <option value="price-asc">Сначала дешёвые (по возрастанию)</option>
            <option value="price-desc">Сначала дорогие (по убыванию)</option>
          </select>
        </div>

      <div class="lesson-panel">
        <span class="step-badge"> Шаг 5 из 6</span>
        <h2>Выпадающий список <select> и событие change</h2>
        <p>При смене пункта в выпадающем списке срабатывает событие change, и мы считываем выбранное значение через select.value.</p>
        <p>Код, который выполняется в этом шаге (откройте <code>main.js</code>):</p>
        <pre><code>// Шаг 5: Выпадающий список select
const sortSelect = document.getElementById('demoSort');

if (sortSelect) {
  sortSelect.addEventListener('change', function () {
    console.log('Выбран режим сортировки:', sortSelect.value);
  });
}
</code></pre>
        <p><em>Совет: введите поисковый запрос в поле выше и проверьте мгновенную фильтрацию.</em></p>
      </div>
    </div>
  </main>
</body>
