<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Шаг 5: Выпадающий список сортировки select — СмартОфис</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../basic/css/style.css">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="../../basic/img/logo.svg">
  <script src="data.js"></script>
</head>
<body>
  <header class="header">
    <div class="container header-container">
      <a href="../../basic/index.html" class="logo">
        <img src="../../basic/img/logo.svg" alt="Логотип" class="logo-icon">
        <span>СмартОфис</span>
      </a>
      <nav class="nav">
        <ul class="nav-list">
          <li><a href="../../basic/index.html" class="nav-link">Главная</a></li>
          <li><a href="#" class="nav-link active">Каталог</a></li>
          <li><a href="../../basic/pages/login.html" class="nav-link nav-btn">Войти</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="main">
    <div class="container">
      <h1 class="page-title">Каталог офисных пространств</h1>
      <p class="page-subtitle">Выберите подходящее помещение для индивидуальной работы или командных встреч</p>

      <div class="catalog-toolbar">
        <input type="text" id="searchInput" class="search-input" placeholder="Поиск по названию офиса...">
        <div class="sort-actions">
          <select id="sortSelect" class="form-control" style="width: auto; padding: 6px 12px; background: #1e293b; color: white; border: 1px solid #334155; border-radius: 6px;">
            <option value="default">По умолчанию</option>
            <option value="price-asc">Цена: по возрастанию ↑</option>
            <option value="price-desc">Цена: по убыванию ↓</option>
          </select>
          <button id="sortAsc" class="btn btn-outline">Цена ↑</button>
          <button id="sortDesc" class="btn btn-outline">Цена ↓</button>
        </div>
      </div>

      <div class="rooms-grid" id="catalogContainer"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-container">
      <div class="footer-info">
        <p><strong>СмартОфис</strong> — Сервис бронирования офисных комнат</p>
        <p>© 2026 СмартОфис. Все права защищены.</p>
      </div>
      <div class="footer-contacts">
        <p>Email: <a href="mailto:info@smartoffice.ru">info@smartoffice.ru</a></p>
        <p>Телефон: <a href="tel:+78005553535">+7 (800) 555-35-35</a></p>
      </div>
    </div>
  </footer>
</body>
<script src="main.js"></script>
</html>
