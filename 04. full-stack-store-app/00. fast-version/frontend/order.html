<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechParts — Оформление заказа</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Критерий №11: Шапка на всех страницах -->
  <header>
    <nav>
      <a href="index.html" class="logo">
        <img src="images/logo.svg" alt="TechParts логотип">
        TechParts
      </a>
      <div class="nav-links" id="nav-menu"></div>
    </nav>
  </header>

  <!-- ============================================================
       СТРАНИЦА ОФОРМЛЕНИЯ ЗАКАЗА — Критерий №19 (до 6 баллов)
       1 балл — разметка и стилизация
       1 балл — доступность только авторизованным
       1 балл — функционал полей
       1 балл — расчёт общей стоимости
       2 балла — отработка «Оформить заказ» (успех/ошибка)
       ============================================================ -->
  <main>
    <h1 class="page-title" style="text-align:center;">Оформление заказа</h1>

    <div class="form-container">
      <!-- Сообщение об успехе/ошибке -->
      <div id="order-message"></div>

      <form id="order-form">

        <!-- 1) Выпадающий список товаров (select) -->
        <!-- Заполняется автоматически из БД при загрузке -->
        <div class="form-group">
          <label for="product-select">Товар</label>
          <select id="product-select" name="product_id" required>
            <option value="">Выберите товар</option>
            <!-- Опции загружаются через JS -->
          </select>
        </div>

        <!-- 2) Дата доставки — не раньше сегодняшнего дня -->
        <div class="form-group">
          <label for="delivery-date">Дата доставки</label>
          <input type="date" id="delivery-date" name="delivery_date" required>
        </div>

        <!-- 3) Количество — целые числа от 1 до 10 -->
        <div class="form-group">
          <label for="quantity">Количество (от 1 до 10)</label>
          <input type="number" id="quantity" name="quantity" required
                 min="1" max="10" value="1">
        </div>

        <!-- 4) Комментарий — необязательное поле -->
        <div class="form-group">
          <label for="comment">Комментарий (необязательно)</label>
          <textarea id="comment" name="comment" rows="3"
                    placeholder="Дополнительные пожелания к заказу"></textarea>
        </div>

        <!-- Автоматически рассчитанная общая стоимость -->
        <!-- Критерий №19: 1 балл — расчёт и отображение стоимости -->
        <div class="total-price" id="total-price">
          Общая стоимость: 0 руб.
        </div>

        <!-- Кнопка «Оформить заказ» -->
        <button type="submit" class="btn btn-primary btn-block">Оформить заказ</button>
      </form>
    </div>
  </main>

  <!-- Критерий №12: Подвал на всех страницах -->
  <footer>
    <div class="footer-content">
      <div class="footer-col">
        <h4>TechParts</h4>
        <p>Собери ПК своей мечты</p>
      </div>
      <div class="footer-col">
        <h4>Контакты</h4>
        <p>Email: info@techparts.ru</p>
        <p>Тел: +7 (800) 555-35-35</p>
      </div>
    </div>
    <div class="footer-bottom">&copy; 2024 TechParts. Все права защищены.</div>
  </footer>

  <script src="js/navigation.js"></script>
  <script src="js/order.js"></script>

</body>
</html>
